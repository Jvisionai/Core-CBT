# Core-CBT 배포 (cbt.jvision.ai.kr)
# 사용법: cp .env.example .env 후 값 채우기 → docker compose up -d --build
# 외부 노출은 web 한 포트만. NPM이 이 포트로 프록시한다.

services:
  web:
    build: .
    image: core-cbt-web
    container_name: core-cbt-web
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_API_URL: http://agent:8001
    ports:
      - "${CBT_WEB_PORT:-3300}:3000"
    volumes:
      - cbt-data:/app/data
    depends_on:
      - agent

  agent:
    build:
      context: .
      dockerfile: fastapi_app/Dockerfile
    image: core-cbt-agent
    container_name: core-cbt-agent
    restart: unless-stopped
    env_file: .env
    environment:
      DATASETS_ROOT: /app/datasets/practicalIndustrial
    expose:
      - "8001"

volumes:
  cbt-data:
